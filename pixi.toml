[workspace]
name = "cudalab"
version = "0.1.0"
description = "CUDA lab - one executable target per demo, built with CMake/Ninja"
channels = ["conda-forge", "nvidia"]
platforms = ["win-64", "linux-64"]

[dependencies]
cmake = ">=3.24"
ninja = ">=1.11"
clang-tools = ">=18"
python = ">=3.11"
cuda-toolkit = ">=13.3,<14"
# 3.16.1's catch_discover_tests joins EXTRA_ARGS into one token; pin 3.15.x.
catch2 = ">=3.15.3,<3.16"
fmt = ">=10"
opencl-headers = "*"

[target.linux-64.dependencies]
gxx_linux-64 = ">=13,<15"
ocl-icd = "*"

[target.win-64.dependencies]
vs2026_win-64 = "*"
khronos-opencl-icd-loader = "*"

[tasks]
env = "python scripts/sync_env.py"
build-debug = "python scripts/build_cmake.py --preset ninja-debug"
build-release = "python scripts/build_cmake.py --preset ninja-release"
build = "pixi run build-release"
clean = "python scripts/build_cmake.py --preset ninja-debug --clean"
run = "python scripts/build_cmake.py --preset ninja-debug --run"
profile = "python scripts/profile.py"
test-debug = "ctest -V --preset ninja-debug"
test-release = "ctest -V --preset ninja-release"
test = "ctest -V --preset ninja-release"
